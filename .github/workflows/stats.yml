name: Generate profile stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate stats cards
        run: node .github/scripts/profile-stats.mjs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_LOGIN: ${{ github.repository_owner }}
          STATS_ORGANIZATION: V4-Company
          STATS_OUTPUT: dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
