name: Park a car

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: parking
  cancel-in-progress: false

jobs:
  park:
    if: startsWith(github.event.issue.title, 'estacionar|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Park the car
        run: node .github/scripts/park-car.mjs
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PARKING_COMMENT: ${{ runner.temp }}/comment.md

      - name: Commit the lot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: park @${ISSUE_AUTHOR}"
          git pull --rebase
          git push
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}

      - name: Answer the driver
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
